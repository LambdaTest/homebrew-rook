name: test-scripts

# The harnesses under scripts/ extract the real sed/Python/bash logic
# out of the committed workflow files and run it, so they only stay
# honest if something runs them.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # ubuntu-latest ships GNU sed, so test-formula-patch.sh's gsed
      # fallback (for BSD sed on macOS) is simply unused here.
      - name: Run the script harnesses
        run: |
          shopt -s nullglob
          harnesses=(scripts/test-*.sh)
          # A glob that quietly matches nothing is a green run that checked
          # nothing. There are 6 harnesses; fewer means one was renamed or
          # deleted, and that should be a red run, not a silent gap.
          if [ "${#harnesses[@]}" -lt 6 ]; then
            echo "::error::expected at least 6 harnesses matching scripts/test-*.sh, found ${#harnesses[@]}"
            exit 1
          fi
          for t in "${harnesses[@]}"; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
